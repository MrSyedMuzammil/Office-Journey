<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice tooltip</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Tooltip Practice</h1>
      <p>
        When i hover on the next word it will show a tooltip
        <span class="tooltip-trigger">
          Hover me.
          <span class="tooltip-text"> This is the tooltip text! </span>
        </span>
        The hover effect is done using only CSS.
      </p>
    </div>
  </body>
</html>
