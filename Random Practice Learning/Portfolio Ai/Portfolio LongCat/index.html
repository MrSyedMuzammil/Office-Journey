<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Aur Chai | Premium Software Development</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --accent: #4ECDC4;
            --gold: #FFD700;
        }
 * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles */
        header {
            padding: 20px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
        }
 .logo span {
            color: var(--accent);
        }
 .logo i {
            margin-right: 10px;
            color: var(--gold);
        }
 nav ul {
            display: flex;
            list-style: none;
        }
 nav ul li {
            margin-left: 30px;
        }
        
        nav ul li a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s ease;
        }
        
        nav ul li a:hover {
            color: var(--accent);
        }
        
        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
 nav ul li a:hover::after {
            width: 100%;
        }
 .cta-button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
 .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.6);
        }
        
        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 80px;
        }
 .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,0 100,100 0,100" fill="rgba(78, 205, 196, 0.1)"/></svg>');
            background-size: 100% 100%;
            z-index: -1;
        }
 .hero-content {
            max-width: 700px;
            animation: fadeInUp 1s ease;
        }
        
        .hero h1 {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .hero h1 span {
            color: var(--accent);
            display: block;
        }
        
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            max-width: 600px;
            opacity: 0.9;
        }
 .hero-buttons {
            display: flex;
            gap: 20px;
        }
        
        .secondary-button {
            background: transparent;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid var(--accent);
            cursor: pointer;
            font-size: 16px;
        }
 .secondary-button:hover {
            background: rgba(78, 205, 196, 0.1);
        }
 /* Services Section */
        .services {
            padding: 100px 0;
            background: rgba(26, 26, 46, 0.7);
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 70px;
        }
        
        .section-title h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }
 .section-title p {
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.8;
 font-size: 1.1rem;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .service-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-color: var(--accent);
        }
        
        .service-icon {
            font-size: 3.5rem;
            margin-bottom: 25px;
            color: var(--accent);
        }
        
        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .service-card p {
            opacity: 0.8;
            margin-bottom: 20px;
        }
        
        /* Stats Section */
        .stats {
            padding: 80px 0;
            background: linear-gradient(45deg, var(--primary), #5a52d5);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
        }
        
        .stat-number {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .stat-text {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        /* Portfolio Section */
        .portfolio {
            padding: 100px 0;
        }
 .portfolio-filters {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
            gap: 15px;
        }
 .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
 .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
 }
        
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .portfolio-item {
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .portfolio-img {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #2c3e50, #4a6491);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--accent);
        }
        
        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            padding: 25px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
 .portfolio-item:hover .portfolio-overlay {
            transform: translateY(0);
        }
 .portfolio-overlay h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
 .portfolio-overlay p {
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        /* Testimonials */
        .testimonials {
            padding: 100px 0;
            background: rgba(26, 26, 46, 0.7);
        }
 .testimonials-container {
            max-width: 800px;
            margin: 0 auto;
        }
 .testimonial-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 40px;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .testimonial-card::before {
            content: """;
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 5rem;
            color: var(--accent);
            opacity: 0.2;
            font-family: Georgia, serif;
        }
        
        .testimonial-content {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 25px;
            opacity: 0.9;
        }
        
        .testimonial-author {
            display: flex;
            align-items: center;
        }
 .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 15px;
        }
        
        .author-info h4 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .author-info p {
            opacity: 0.7;
        }
        
        /* CTA Section */
        .cta-section {
            padding: 120px 0;
            text-align: center;
            background: linear-gradient(45deg, #1a1a2e, #16213e);
 position: relative;
            overflow: hidden;
        }
        
        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.1) 0%, transparent 70%);
            z-index: 0;
        }
        
        .cta-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .cta-content h2 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 25px;
            font-family: 'Montserrat', sans-serif;
        }
        
        .cta-content p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        /* Footer */
        footer {
            background: #1a1a2e;
            padding: 80px 0 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
 .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }
        
        .footer-col h3 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }
        
        .footer-col h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--accent);
        }
 .footer-col p {
            opacity: 0.8;
            margin-bottom: 20px;
        }
 .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
 .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
 .social-links a:hover {
            background: var(--accent);
            transform: translateY(-5px);
        }
 .footer-links {
            list-style: none;
        }
 .footer-links li {
            margin-bottom: 15px;
        }
 .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
 .footer-links a:hover {
            color: var(--accent);
            transform: translateX(5px);
        }
 .footer-links a i {
            margin-right: 10px;
            width: 20px;
        }
 .copyright {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 3.5rem;
            }
 nav ul {
                display: none;
            }
            
            .mobile-menu-btn {
                display: block;
            }
