<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Color Spotlight Portrait</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #030014; /* Dark blue/black background */
        font-family: "Courier New", Courier, monospace;
        color: #999;
        overflow: hidden;
      }

      canvas#particle-canvas {
        cursor: none;
        display: block;
      }

      .instructions {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 1px;
        text-align: center;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>

    <div class="instructions">
      Your Portrait (Color Spotlight)
      <br />
      (JavaScript/Canvas recreation)
    </div>

    <script>
      // --- Configuration ---

      const IMAGE_PATH = "your-photo.png";

      // [--- FIX 1: PERFORMANCE ---]
      // Increased from 6 to 10. This reduces the number of particles
      // significantly (by 64%!), which is the biggest fix for slowness.
      const PARTICLE_RESOLUTION = 10;
      const SPOTLIGHT_RADIUS = 120;
      const MAX_PARTICLE_SIZE = 4;
      const LERP_FACTOR = 0.08;

      // --- Global Variables ---
      const canvas = document.getElementById("particle-canvas");
      const ctx = canvas.getContext("2d");

      let particles = [];
      let imageWidth, imageHeight;

      const mouse = {
        x: -Infinity,
        y: -Infinity,
      };

      function getGrayscale(r, g, b) {
        return r * 0.299 + g * 0.587 + b * 0.114;
      }

      function toRGBA(r, g, b, a) {
        return `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(
          b
        )}, ${a})`;
      }

      class Particle {
        constructor(x, y, baseRadius, originalColor) {
          this.x = x;
          this.y = y;

          this.baseRadius = baseRadius;
          this.targetRadius = baseRadius;
          this.currentRadius = baseRadius;

          this.originalColor = originalColor;

          // [--- FIX 2: VISIBILITY ---]
          // Increased alpha from 0.1 to 0.4. This makes the
          // default "dimmed" image much more visible.
          const gray = getGrayscale(
            originalColor.r,
            originalColor.g,
            originalColor.b
          );
          this.dimmedColor = { r: gray, g: gray, b: gray, a: 0.4 };

          this.currentColor = { r: gray, g: gray, b: gray, a: 0.4 };
          this.targetColor = this.dimmedColor;
        }

        update() {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;

          // [--- FIX 4: PERFORMANCE ---]
          // We check the *squared* distance. This is much, much
          // faster than Math.sqrt() and avoids the performance bottleneck.
          const distanceSq = dx * dx + dy * dy;
          const spotlightRadiusSq = SPOTLIGHT_RADIUS * SPOTLIGHT_RADIUS;

          if (distanceSq < spotlightRadiusSq) {
            // Only *now* do we do the slower Math.sqrt(), and only
            // for the few particles inside the spotlight.
            const distance = Math.sqrt(distanceSq);
            const ratio = 1 - distance / SPOTLIGHT_RADIUS;

            this.targetRadius =
              this.baseRadius + (MAX_PARTICLE_SIZE - this.baseRadius) * ratio;

            this.targetColor = {
              r: this.originalColor.r,
              g: this.originalColor.g,
              b: this.originalColor.b,
              a: Math.min(1, ratio + 0.3),
            };
          } else {
            this.targetRadius = this.baseRadius;
            this.targetColor = this.dimmedColor;
          }

          this.currentRadius +=
            (this.targetRadius - this.currentRadius) * LERP_FACTOR;

          this.currentColor.r +=
            (this.targetColor.r - this.currentColor.r) * LERP_FACTOR;
          this.currentColor.g +=
            (this.targetColor.g - this.currentColor.g) * LERP_FACTOR;
          this.currentColor.b +=
            (this.targetColor.b - this.currentColor.b) * LERP_FACTOR;
          this.currentColor.a +=
            (this.targetColor.a - this.currentColor.a) * LERP_FACTOR;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
          ctx.fillStyle = toRGBA(
            this.currentColor.r,
            this.currentColor.g,
            this.currentColor.b,
            this.currentColor.a
          );
          ctx.fill();
        }
      }

      function init() {
        const image = new Image();

        image.src = IMAGE_PATH;

        image.onload = () => {
          imageWidth = image.width;
          imageHeight = image.height;

          canvas.width = imageWidth;
          canvas.height = imageHeight;

          const tempCanvasOriginal = document.createElement("canvas");
          const tempCtxOriginal = tempCanvasOriginal.getContext("2d");
          tempCanvasOriginal.width = imageWidth;
          tempCanvasOriginal.height = imageHeight;
          tempCtxOriginal.drawImage(image, 0, 0, imageWidth, imageHeight);
          const originalImageData = tempCtxOriginal.getImageData(
            0,
            0,
            imageWidth,
            imageHeight
          ).data;

          particles = [];
          for (let y = 0; y < imageHeight; y += PARTICLE_RESOLUTION) {
            for (let x = 0; x < imageWidth; x += PARTICLE_RESOLUTION) {
              const index = (y * imageWidth + x) * 4;

              const r = originalImageData[index];
              const g = originalImageData[index + 1];
              const b = originalImageData[index + 2];
              const a = originalImageData[index + 3];

              const originalColor = { r, g, b, a: a / 255 };

              const brightness = getGrayscale(r, g, b);

              // [--- FIX 3: VISIBILITY ---]
              // Changed '+ 0.2' to '0.5 + ...'. This makes the
              // minimum particle size larger, so dark areas
              // in your photo are still visible as a dim shape.
              const baseRadius =
                0.5 + (brightness / 255) * (MAX_PARTICLE_SIZE / 2);

              if (a > 0) {
                particles.push(new Particle(x, y, baseRadius, originalColor));
              }
            }
          }

          animate();
        };

        image.onerror = () => {
          console.error(
            "Error loading image. Check the IMAGE_PATH. Make sure it supports CORS."
          );
          ctx.fillStyle = "red";
          ctx.font = "16px Courier New";
          ctx.fillText("Error: Could not load image.", 10, 30);
          ctx.fillText(`Path: ${IMAGE_PATH}`, 10, 50);
          ctx.fillText("Is the file in the same folder?", 10, 70);
          ctx.fillText("Are you running a local server?", 10, 90);
        };
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const particle of particles) {
          particle.update();
          particle.draw();
        }

        requestAnimationFrame(animate);
      }

      // --- Event Listeners ---
      window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      window.addEventListener("mouseleave", () => {
        mouse.x = -Infinity;
        mouse.y = -Infinity;
      });

      window.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
          }
          e.preventDefault();
        },
        { passive: false }
      );

      window.addEventListener("touchend", () => {
        mouse.x = -Infinity;
        mouse.y = -Infinity;
      });

      // --- Start the application ---
      init();
    </script>
  </body>
</html>
